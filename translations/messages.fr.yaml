# Pages légales (lot 8). Hébergeur : l’hébergeur, d'après https://hebergeur.example.com/cgv/ et le pied de page du site
# l’hébergeur (consultés le 24/10/2026). Éditeur non professionnel : LCEN, article 6, III, 2.
legal:
  contact_link: formulaire de contact
  updated: "Dernière mise à jour : %date%"
  notice:
    title: Mentions légales
    meta_description: "Mentions légales du site de Guillaume Couget : éditeur, hébergeur, propriété intellectuelle et crédits."
    publisher:
      title: Éditeur du site
      text: "Le site guillaume-couget.fr est édité à titre non professionnel par Guillaume Couget, particulier. Directeur de la publication : Guillaume Couget."
      contact: "Pour le contacter, utilisez le"
      lcen: "Conformément à l'article 6, III, 2 de la loi n° 2004-575 du 21 juin 2004 pour la confiance dans l'économie numérique (LCEN), les coordonnées personnelles de l'éditeur, qui agit à titre non professionnel, ont été communiquées à l'hébergeur."
    host:
      title: Hébergeur
      phone: "Téléphone : %phone%"
    ip:
      title: Propriété intellectuelle
      text: "Les textes, photographies, illustrations, logos et le code de ce site appartiennent à Guillaume Couget, sauf mention contraire. Toute reproduction, totale ou partielle, sans son autorisation écrite est interdite. Les marques et logos cités appartiennent à leurs propriétaires respectifs."
    calculator:
      title: Outils de calcul
      text: "Les outils de la calculatrice donnent des résultats indicatifs, à vérifier avant toute utilisation. Ils ne remplacent ni une étude réalisée par un professionnel, ni les normes et réglementations en vigueur ; leur utilisation se fait sous la seule responsabilité de l'utilisateur."
    credits:
      title: Crédits
      items:
        - "Conception et développement : Guillaume Couget, avec le framework Symfony."
        - "Mise en page : Tailwind CSS et composants Tailkit UI ; icônes Heroicons (licence MIT)."
        - "Police de caractères : Inter (licence SIL Open Font License)."
        - "Assistant de l'espace recruteur : modèles d'IA de Mistral AI, intégrés par Guillaume Couget."
        - "Protection des formulaires contre les robots : Cloudflare Turnstile."
        - "Photographies et illustrations : tous droits réservés."
    privacy:
      title: Données personnelles
      text: "Le traitement de vos données personnelles est décrit dans la"
  privacy:
    title: Politique de confidentialité
    meta_description: "Politique de confidentialité du site de Guillaume Couget : données collectées, finalités, bases légales, durées de conservation, destinataires, cookies et droits."
    intro: "Cette page explique quelles données personnelles le site traite, pourquoi, combien de temps et comment exercer vos droits. Le détail de chaque point se déplie sous le résumé."
    contact_link: formulaire de contact
    summary:
      title: En bref
      items:
        - "Aucune publicité, aucune mesure d'audience, aucun cookie de suivi."
        - "Le site ne garde que ce que vous lui envoyez (contact, demande d'accès, assistant) et l'efface automatiquement, au plus tard 12 mois après votre dernière activité."
        - "Vos données ne sont ni vendues ni utilisées pour de la prospection ; seuls Guillaume Couget et les prestataires techniques listés ci-dessous y ont accès."
        - "Une demande d'accès n'est jamais refusée par un automate : Guillaume Couget décide lui-même."
        - "Vous pouvez consulter, télécharger, corriger ou supprimer vos données, et saisir la CNIL."
      details_hint: "Ouvrez une section pour en afficher le détail."
    controller:
      title: Responsable du traitement
      text: "Guillaume Couget, particulier, éditeur du site guillaume-couget.fr. Pour toute question sur vos données ou pour exercer vos droits, utilisez le"
    contact:
      title: Formulaire de contact
      text: "Données : nom, adresse e-mail, entreprise (facultative), objet, message, date à laquelle vous avez coché la case d'accord, et adresse IP. Finalité : vous répondre ; l'adresse IP sert à limiter les abus. Conservation : 12 mois après la réception du message ; adresse IP effacée après 30 jours."
    recruiter:
      title: Espace recruteur
      access: "Données : adresse e-mail professionnelle, nom, entreprise, fonction et site web de l'entreprise (facultatifs), message (facultatif), date à laquelle vous avez coché la case d'accord, adresse IP, résultat des contrôles anti-abus, dates de connexion et signaux d'intérêt (« Je suis intéressé », téléchargement du CV complet). Finalité : examiner votre demande d'accès et vous donner accès aux informations réservées aux recruteurs."
      retention: "Conservation : demande refusée supprimée 30 jours après la décision ; accès validé : données supprimées 12 mois après votre dernière activité ; adresse IP effacée après 30 jours. Depuis votre espace (lien « Mes données et leur suppression »), vous pouvez télécharger vos données dans un fichier lisible (JSON) ou les supprimer à tout moment."
      reminders: "Sept jours avant la fin de votre accès, un e-mail de rappel vous propose de le prolonger. Chaque rappel contient un lien « Ne plus recevoir ces rappels », avec effet immédiat."
    decision:
      title: Score et synthèse de l'entreprise (aide à la décision)
      score: "À l'arrivée d'une demande d'accès, le site calcule un score indicatif sur 100 : serveurs de messagerie du domaine trouvés (+ 30), domaine professionnel, ni jetable ni messagerie grand public (+ 40), entreprise renseignée (+ 20), message joint (+ 10) ; une adresse jetable ou une adresse IP inscrite sur une liste de blocage (Spamhaus) ramène le score à 0."
      synthesis: "Guillaume Couget peut aussi demander, depuis l'administration, une synthèse de l'entreprise en quatre lignes (type, secteur, activité, crédibilité), générée par Mistral AI à partir du nom de l'entreprise, du domaine de l'adresse e-mail (sauf messagerie grand public) et du message, dont les coordonnées sont retirées. Jamais votre nom ni votre adresse e-mail."
      human: "Le score et la synthèse ne sont qu'une aide : aucune demande n'est refusée par un traitement automatisé. Chaque refus est décidé par Guillaume Couget lui-même (article 22 du RGPD)."
      human_manual: "Chaque demande est acceptée ou refusée par Guillaume Couget lui-même."
      human_auto: "Seule exception, favorable : une demande dont le score atteint %threshold% sur 100 est acceptée automatiquement ; en dessous, Guillaume Couget décide."
      rights: "Vous pouvez demander le détail du score et de la synthèse de votre demande (ils figurent aussi dans le téléchargement de vos données), faire valoir votre point de vue et obtenir un nouvel examen par Guillaume Couget, en écrivant par le"
    notifications:
      title: Notifications reçues par Guillaume Couget
      text: "Quand une demande d'accès à l'espace recruteur arrive, Guillaume Couget en est prévenu, pour sa seule information et pour décider de la demande, par un e-mail reçu dans sa boîte de recrutement (webmail) et, s'il les a activées, par des messageries : Telegram et Discord, services situés hors de l'Union européenne (voir « Destinataires et transferts »). Ces notifications indiquent votre nom, votre entreprise, votre fonction et le site web de l'entreprise s'ils sont renseignés, le domaine de votre adresse e-mail (par exemple « @entreprise.fr »), le début de votre message (200 caractères) et, le cas échéant, la synthèse de l'entreprise ; jamais votre adresse e-mail complète ni votre adresse IP. Pour un message de contact ou un signal d'intérêt, l'e-mail indique le nom et l'entreprise ; les messageries ne reçoivent alors que le type d'évènement et un lien vers l'administration du site, sans aucune donnée personnelle."
    emails:
      title: E-mails du site
      text: "Les e-mails du site partent toujours d'une adresse d'envoi du domaine guillaume-couget.fr (« noreply »), par les serveurs de l’hébergeur. Ceux que reçoit Guillaume Couget sont classés en deux catégories : « Recrutement » (demandes d'accès, messages du formulaire de contact, questions posées depuis l'assistant, suppressions de données) et « Général » (fonctionnement technique du site, sans donnée personnelle). Ils arrivent dans des boîtes webmail (voir « Destinataires et transferts »). Seuls les recruteurs dont l'accès est validé reçoivent une adresse de réponse ; avant validation, ou après un refus, on écrit à Guillaume Couget par le formulaire de contact du site. Le site garde un historique des envois (date, type d'e-mail, catégorie, adresse du destinataire masquée : seuls la première lettre et le domaine restent, envoyé ou non), jamais leur contenu ; il est supprimé après 90 jours."
    turnstile:
      title: Protection contre les robots
      text: "Les formulaires publics utilisent Cloudflare Turnstile, qui analyse des informations techniques de votre navigateur (adresse IP, empreinte de la connexion chiffrée, navigateur utilisé) pour distinguer un humain d'un robot, sans cookie publicitaire ni pistage d'un site à l'autre. Le site lui-même ne conserve pas ces informations."
    cookies:
      title: Cookies et stockage dans le navigateur
      intro: "Voici la liste complète de ce que le site dépose ou lit dans votre navigateur. Tout est strictement nécessaire au service que vous demandez ou reste dans votre navigateur : aucun consentement n'est requis (article 82 de la loi Informatique et Libertés)."
      name: Nom
      kind: Type
      purpose: Rôle
      duration: Durée
      no_tracking: "Ce site n'utilise aucun cookie de mesure d'audience ni de publicité : aucun bandeau de consentement n'est donc nécessaire."
      rows:
        session:
          name: GC_SESSID
          kind: Cookie (site)
          purpose: "Session : garde votre connexion à l'espace recruteur et les jetons de sécurité des formulaires. Créé seulement quand vous utilisez un formulaire ou l'espace recruteur."
          duration: Jusqu'à la fermeture du navigateur
        csrf:
          name: __Host-csrf-token_…
          kind: Cookie (site)
          purpose: "Jeton anti-falsification d'un formulaire (protection contre les envois frauduleux depuis un autre site)."
          duration: Effacé dès l'envoi du formulaire
        turnstile:
          name: Cloudflare Turnstile
          kind: Service tiers (formulaires)
          purpose: "Vérification anti-robot des formulaires publics : Cloudflare peut lire ou déposer les éléments techniques nécessaires à ce seul contrôle."
          duration: Le temps de la vérification
        theme:
          name: theme
          kind: Stockage local du navigateur
          purpose: "Votre choix de thème (clair ou sombre). Jamais envoyé au site."
          duration: Jusqu'à ce que vous l'effaciez
        calculator:
          name: calculator.favorites
          kind: Stockage local du navigateur
          purpose: "Vos calculatrices favorites. Jamais envoyé au site."
          duration: Jusqu'à ce que vous l'effaciez
    hosting:
      title: Hébergement et journaux techniques
      text: "Le site est hébergé en France par l’hébergeur (Paris), qui conserve des journaux techniques (adresse IP, pages demandées) pour la sécurité et le bon fonctionnement de ses serveurs. Le site tient aussi son propre journal de sécurité (tentatives de connexion à l'administration, limites d'envoi atteintes : date, adresse IP, navigateur), supprimé après 90 jours."
      backups: "La base de données est sauvegardée chaque jour chez l’hébergeur, et Guillaume Couget en garde chaque mois une copie chiffrée hors du serveur (seules les trois dernières sont conservées). Ces sauvegardes ne servent qu'à restaurer le site après un incident : une donnée supprimée peut y subsister jusqu'à leur remplacement, au plus trois mois pour les copies mensuelles."
    recipients:
      title: Destinataires et transferts hors de l'Union européenne
      intro: "Vos données ne sont lues que par Guillaume Couget. Elles ne sont ni vendues, ni louées, ni utilisées pour de la prospection. Les prestataires techniques ci-dessous les reçoivent pour leur seul rôle ; les liens mènent à leurs documents officiels (consultés le 29 octobre 2026)."
