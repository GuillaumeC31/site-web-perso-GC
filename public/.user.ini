; Réglages PHP de production du site (lus par PHP-FPM / CGI dans le dossier public, chez l’hébergeur).
; Les changements sont pris en compte après quelques minutes (user_ini.cache_ttl) ou au redémarrage de PHP.

; Sécurité (PHP2Shell, CVE-2026-109618 et CVE-2026-109619, voir docs/SECURITE_VEILLE.md) :
; le site n'utilise pas le suivi de progression des envois de fichiers.
session.upload_progress.enabled = 0

; Envois de fichiers, au plus juste pour les fonctions du site :
; - photo du profil, couverture et images d'un projet : 10 Mo par fichier (formulaires de l'admin) ;
; - archive d'import d'un projet : 50 Mo (ProjectPackageFormat::MAX_ARCHIVE_BYTES) ;
; - galerie : jusqu'à 5 images de 10 Mo dans un même envoi (ProjectType::MAX_IMAGES_PER_UPLOAD).
; post_max_size couvre l'archive de 50 Mo ou 5 images de 10 Mo, plus le reste du formulaire.
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 6

; Mémoire : une image de 8000 × 8000 px (taille maximale acceptée) décodée par GD occupe environ
; 256 Mo, plus les copies réduites.
memory_limit = 384M
