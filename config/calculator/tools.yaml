# Registre de la calculatrice (CDC § 8) : catégories et outils, dans l'ordre d'affichage par défaut.
#
# Lu par : App\Service\Calculator\CalculatorRegistry. L'admin peut ensuite, outil par outil,
# activer ou désactiver, modifier le texte d'aide, la norme citée et l'ordre (CalculatorToolSetting).
#
# Les adresses (slugs) sont celles de l'ancien site : /calculatrice/{categorie}/{outil}.
#
# Statuts :
#   available : porté sur ce site, résultats identiques à l'ancien (tests de non-régression)
#   legacy    : existe dans l'ancien site, portage prévu (lots 5b et suivants) ; non publié
#   planned   : n'existait pas dans l'ancien site (page « en construction » ou vide) ; à créer (lot 5-bis)
#   merged    : fusionné dans un autre outil (« merged_into ») ; l'ancienne adresse redirige (301)
#
# meta_description (facultatif) : texte court de la balise meta (160 caractères au plus) quand le résumé
# (summary) est plus long ; sinon, le résumé sert aussi de balise meta.
#
# reference : norme ou source proposée. Elle n'est affichée qu'une fois validée dans l'admin
# (« à vérifier » par défaut).
#
# Icônes : tracés Heroicons (contour, 24 px), repris de l'ancien site.

