# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # TEXTES_SITE.md (hors dépôt) : plancher personnel cherché dans les fiches du « Cerveau de l'IA »
    # (SalaryFloorDetector) ; absent sur le serveur, le contrôle y est alors indisponible.
    app.textes_site_path: '%kernel.project_dir%/../TEXTES_SITE.md'
    # Racine où l'image de partage est écrite (ShareImageGenerator) : public/ ; un dossier de var/ en test
    app.share_image_public_dir: '%kernel.project_dir%/public'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Fixture fictive (prétentions et plancher fictifs) : le vrai fichier n'est jamais lu par les tests
        app.textes_site_path: '%kernel.project_dir%/tests/Fixtures/textes_site_sample.md'
        # Images de partage des tests hors de public/ (jamais servies, nettoyées par les tests)
        app.share_image_public_dir: '%kernel.project_dir%/var/test-public'
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        # Réponses HTTP simulées (Turnstile, Discord, Telegram) et contrôles DNS simulés (score des demandes)
        App\Tests\Support\MockHttpResponseFactory: ~
        App\Tests\Support\FakeDnsChecker: ~
        App\Service\Recruiter\DnsChecker: '@App\Tests\Support\FakeDnsChecker'
